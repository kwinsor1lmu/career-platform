<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ resume.profile.name }} — {{ resume.profile.headline }}">
    <title>{{ resume.profile.name }} | {{ resume.profile.headline }}</title>
    <link rel="canonical" href="{{ canonical_url }}">
    <meta property="og:type" content="profile">
    <meta property="og:title" content="{{ resume.profile.name }}">
    <meta property="og:description" content="{{ resume.profile.headline }}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
    <link rel="preload" href="{{ url_for('static', path='fonts/ibm-plex-sans-400.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ url_for('static', path='fonts/ibm-plex-sans-600.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <script type="application/ld+json">{{ {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": resume.profile.name,
      "jobTitle": resume.profile.headline,
      "description": resume.profile.summary,
      "url": canonical_url,
      "sameAs": resume.contact_links | map(attribute="url") | map("string") | reject("mailto") | list,
    } | tojson }}</script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% block content %}{% endblock %}
  </body>
</html>
